<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">Из чего складывается цена передержки</title>
<desc id="d">Цена суток передержки зависит от шести факторов: размер и порода питомца, формат передержки, уход и прогулки, особые нужды, даты и срок, район и трансфер.</desc>
<rect width="720" height="400" rx="24" fill="#FFF6EE"/>
<text x="36" y="56" font-family="PT Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#2b2420">Из чего складывается цена передержки</text>
<g font-family="PT Sans, Arial, sans-serif">
<g transform="translate(36 84)"><rect width="200" height="130" rx="18" fill="#fff" stroke="#E8D6C4" stroke-width="2"/><circle cx="34" cy="36" r="18" fill="#FC6751"/><text x="34" y="43" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="18" y="84" font-size="18" font-weight="700" fill="#2b2420">Размер и порода</text><text x="18" y="108" font-size="15" fill="#5b5047">крупным — дороже</text></g>
<g transform="translate(260 84)"><rect width="200" height="130" rx="18" fill="#fff" stroke="#E8D6C4" stroke-width="2"/><circle cx="34" cy="36" r="18" fill="#FC6751"/><text x="34" y="43" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="18" y="84" font-size="18" font-weight="700" fill="#2b2420">Формат</text><text x="18" y="108" font-size="15" fill="#5b5047">дом, зоотель, номер</text></g>
<g transform="translate(484 84)"><rect width="200" height="130" rx="18" fill="#fff" stroke="#E8D6C4" stroke-width="2"/><circle cx="34" cy="36" r="18" fill="#FC6751"/><text x="34" y="43" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="18" y="84" font-size="18" font-weight="700" fill="#2b2420">Уход и прогулки</text><text x="18" y="108" font-size="15" fill="#5b5047">сколько раз в день</text></g>
<g transform="translate(36 236)"><rect width="200" height="130" rx="18" fill="#fff" stroke="#E8D6C4" stroke-width="2"/><circle cx="34" cy="36" r="18" fill="#FC6751"/><text x="34" y="43" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="18" y="84" font-size="18" font-weight="700" fill="#2b2420">Особые нужды</text><text x="18" y="108" font-size="15" fill="#5b5047">лекарства, возраст</text></g>
<g transform="translate(260 236)"><rect width="200" height="130" rx="18" fill="#fff" stroke="#E8D6C4" stroke-width="2"/><circle cx="34" cy="36" r="18" fill="#FC6751"/><text x="34" y="43" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="18" y="84" font-size="18" font-weight="700" fill="#2b2420">Даты и срок</text><text x="18" y="108" font-size="15" fill="#5b5047">праздники дороже</text></g>
<g transform="translate(484 236)"><rect width="200" height="130" rx="18" fill="#fff" stroke="#E8D6C4" stroke-width="2"/><circle cx="34" cy="36" r="18" fill="#FC6751"/><text x="34" y="43" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="18" y="84" font-size="18" font-weight="700" fill="#2b2420">Район и трансфер</text><text x="18" y="108" font-size="15" fill="#5b5047">доставка питомца</text></g>
</g>
</svg>
