<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Зооконсьерж</title>
<meta name="theme-color" content="#FC6751">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Зооконсьерж">
<meta name="application-name" content="Зооконсьерж">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/brand.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;line-height:1.35}
header{background:var(--cream);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--line)}
header .brand{font-size:20px}
.hl{display:flex;align-items:center;gap:10px}
header nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
header nav a{color:var(--mute);text-decoration:none;font-size:14px}
header nav a.on{color:var(--coral);font-weight:700}
#log{flex:1;overflow-y:auto;padding:12px 10px 4px;display:flex;flex-direction:column;gap:7px}
.m{max-width:86%;padding:9px 12px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(80,50,20,.08)}
.m.bot{background:var(--card);align-self:flex-start;border-bottom-left-radius:6px}
.m.me{background:var(--peach);align-self:flex-end;border-bottom-right-radius:6px}
.m a{color:var(--boarding)}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.kb .r{display:flex;gap:6px}
.kb button,.kb a.b{flex:1;font:700 15px var(--font);padding:9px 8px;border:1.5px solid var(--coral);border-radius:999px;background:var(--cream);color:var(--coral);text-align:center;text-decoration:none;cursor:pointer}
.kb button:active,.kb a.b:active{background:var(--coral);color:#fff}
#rk{display:none;padding:6px 8px;background:var(--cream);gap:6px;flex-direction:column;border-top:1.5px solid var(--line)}
#rk .r{display:flex;gap:6px}
#rk button{flex:1;font:700 16px var(--font);padding:11px 6px;border:0;border-radius:999px;background:var(--peach);color:var(--ink)}
form{display:flex;gap:8px;padding:8px;background:var(--cream);border-top:1.5px solid var(--line);padding-bottom:max(8px,env(safe-area-inset-bottom))}
form input{flex:1;font-size:16px;border-radius:999px;min-width:0}
form button{font:700 20px var(--font);border:0;border-radius:999px;width:48px;background:var(--coral);color:#fff}
form button.cmd{background:var(--cream);color:var(--coral);border:1.5px solid var(--line);font-size:18px}
#cmds{display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--cream);border-top:1.5px solid var(--line)}
#cmds[hidden]{display:none}
#cmds button{font:600 15px var(--font);text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
#st{font-size:12px;color:var(--mute);text-align:center;padding:2px}
#ios{display:none;margin:8px 10px 0;padding:10px 12px;border-radius:14px;background:var(--peach);font-size:14px}
#ios b{color:var(--coral)}
</style>
</head>
<body>
__RIBBON__<header><span class="hl">__BACK__<span class="brand"><span class="zoo">ЗОО</span>КОНСЬЕРЖ</span></span><nav><a id="nt" href="#" hidden>🔔 Уведомления</a><a href="/cabinet">Кабинет</a><a href="__TG_URL__" target="_blank" rel="noopener">В Telegram</a><a id="ad" class="on" href="/portal" hidden>Портал</a><a href="__LOGOUT__">Выйти</a></nav></header>
<div id="ios">Чтобы открывать как приложение: нажмите <b>«Поделиться»</b> → <b>«На экран „Домой“»</b>. Иконка и название будут «Зооконсьерж».</div>
<div id="log" aria-live="polite"></div>
<div id="st"></div>
<div id="rk"></div>
<div id="cmds" hidden><button type="button" data-cmd="/menu">Главное меню</button><button type="button" data-cmd="/profile">Профиль и питомцы</button><button type="button" data-cmd="/policy">Политика обработки данных</button><button type="button" data-cmd="/delete_me">Удалить мои данные</button></div><form id="f" autocomplete="off"><button type="button" id="cmd" class="cmd" aria-label="Меню команд" aria-expanded="false">☰</button><input id="t" placeholder="Сообщение…" enterkeyhint="send" maxlength="1000"><button>➤</button></form>
<script>
(function(){
var API='__API__';  // /chat — клиент, /portal/bot — администратор (подставляет сервер)
var log=document.getElementById('log'),rk=document.getElementById('rk'),st=document.getElementById('st'),inp=document.getElementById('t');
var nodes={},last=0,polling=false,fails=0,initial=true,unread=0,baseTitle=document.title;
function H(h,o){h=h||{};h['X-Zc']='1';h['Content-Type']='application/json';return h}
function linkify(el,text){
  var re=/https?:\/\/[^\s<>"]+/g,i=0,m;
  while((m=re.exec(text))){
    el.appendChild(document.createTextNode(text.slice(i,m.index)));
    var u=m[0].replace(/[.,;:!?)]+$/,'');
    var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener noreferrer';a.textContent=u;el.appendChild(a);
    i=m.index+u.length;re.lastIndex=i;
  }
  el.appendChild(document.createTextNode(text.slice(i)));
}
function keyboard(msg,div){
  var old=div.querySelector('.kb');if(old)old.remove();
  if(!msg.inline||!msg.inline.length)return;
  var kb=document.createElement('div');kb.className='kb';
  msg.inline.forEach(function(row){
    var r=document.createElement('div');r.className='r';
    row.forEach(function(b){
      var e;
      if(b.url){e=document.createElement('a');e.className='b';e.href=b.url;e.target='_blank';e.rel='noopener noreferrer'}
      else{e=document.createElement('button');e.type='button';e.onclick=function(){send({cb:b.cb,mid:msg.mid})}}
      e.textContent=b.t;r.appendChild(e)});
    kb.appendChild(r)});
  div.appendChild(kb);
}
function render(msg){
  var div=nodes[msg.mid];
  if(!div){div=document.createElement('div');div.className='m '+(msg.who==='me'?'me':'bot');nodes[msg.mid]=div;log.appendChild(div);div._d={}}
  var d=div._d;for(var k in msg)d[k]=msg[k];
  var body=div.querySelector('.tx');
  if(!body){body=document.createElement('span');body.className='tx';div.insertBefore(body,div.firstChild)}
  body.textContent='';linkify(body,d.text||'');
  var old=div.querySelector('.fl');if(old)old.remove();
  if(d.file){var a=document.createElement('a');a.className='fl';a.href='__API__/file/'+d.file.id;a.textContent='\n📎 '+d.file.name;a.style.display='block';div.appendChild(a)}
  keyboard(d,div);
  if(d.reply!==undefined)setReply(d.reply);
}
function setReply(rows){
  rk.textContent='';
  if(!rows||!rows.length){rk.style.display='none';return}
  rows.forEach(function(row){
    var r=document.createElement('div');r.className='r';
    row.forEach(function(b){
      var e=document.createElement('button');e.type='button';e.textContent=b.t;
      e.onclick=function(){
        if(b.contact){var p=prompt('Ваш номер телефона (например, +7 900 123-45-67):');if(p)send({phone:p})}
        else if(b.map){location.href=b.map}
        else if(b.loc){locate()}
        else send({text:b.t})};
      r.appendChild(e)});
    rk.appendChild(r)});
  rk.style.display='flex';
}
// геопозиция из браузера — то же, что кнопка «Отправить геопозицию» в Telegram
function locate(){
  if(!navigator.geolocation){st.textContent='Геопозиция в этом браузере недоступна. Впишите адрес текстом.';return}
  st.textContent='Определяю геопозицию…';
  function ok(p){st.textContent='';send({loc:{lat:p.coords.latitude,lon:p.coords.longitude}})}
  function fail(e){
    if(e&&e.code===1){
      var mac=/Macintosh/.test(navigator.userAgent),ios=/iPhone|iPad/.test(navigator.userAgent);
      st.textContent='Браузер не дал доступ к геопозиции. Разрешите его: значок 📍 в адресной строке → «Разрешить»'+
        (ios?' (или Настройки → Конфиденциальность → Службы геолокации → браузер).':
         mac?' (на Mac ещё: Системные настройки → Конфиденциальность → Службы геолокации → включите браузер).':'.')+
        ' Или нажмите «🗺 Найти на карте».';
    }else st.textContent='Устройство не смогло определить место (на компьютере так бывает). Нажмите «🗺 Найти на карте» или впишите адрес.';
  }
  // сначала точно (GPS телефона); если не успели или не вышло — ещё раз с обычной точностью (Wi-Fi, как на компьютере)
  navigator.geolocation.getCurrentPosition(ok,function(e){
    if(e&&e.code===1)return fail(e);
    navigator.geolocation.getCurrentPosition(ok,fail,{enableHighAccuracy:false,timeout:20000,maximumAge:300000});
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
function bottom(){log.scrollTop=log.scrollHeight}
// «прилипание» к низу: пока человек внизу, новые сообщения и появление клавиатуры не уводят ленту
var stick=true;
log.addEventListener('scroll',function(){stick=log.scrollHeight-log.scrollTop-log.clientHeight<80});
window.addEventListener('resize',function(){if(stick)bottom()});
if(window.visualViewport)visualViewport.addEventListener('resize',function(){if(stick)bottom()});
function apply(ev){
  if(ev.id)last=Math.max(last,ev.id);
  if(ev.op==='send'||ev.op==='edit'){
    render(ev);if(stick||ev.who==='me')bottom();
    if(ev.op==='send'&&ev.who==='bot'&&!initial)alert_(ev.text)
  }else if(ev.op==='delete'){var d=nodes[ev.mid];if(d){d.remove();delete nodes[ev.mid]}}
}
function alert_(text){
  if(document.visibilityState==='visible')return;
  unread++;document.title='('+unread+') '+baseTitle;
  // если включены push-уведомления, их покажет служебный скрипт; иначе — простое уведомление открытой вкладки
  try{if(!window.__pushOn&&window.Notification&&Notification.permission==='granted')new Notification('Зооконсьерж',{body:(text||'').slice(0,140)})}catch(e){}
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){unread=0;document.title=baseTitle}});
function send(body){
  return fetch('__API__/api/send',{method:'POST',headers:H(),body:JSON.stringify(body),credentials:'same-origin'}).then(function(r){
    if(r.status===429)st.textContent='Слишком часто, подождите минуту';
    else if(r.status===401)location.reload();
    else st.textContent='';
  }).catch(function(){st.textContent='Нет связи. Повторите.'});
}
// Опрос с таймаутом: если запрос «завис» (телефон уснул, сеть сменилась), он прерывается и начинается заново.
var pollCtl=null;
function poll(){
  if(polling)return;polling=true;
  var ctl=new AbortController();pollCtl=ctl;
  var tm=setTimeout(function(){ctl.abort()},30000);
  fetch('__API__/api/poll?after='+last,{credentials:'same-origin',signal:ctl.signal}).then(function(r){
    if(r.status===401){location.reload();return null}
    return r.json()}).then(function(j){
    clearTimeout(tm);if(pollCtl!==ctl)return;
    polling=false;if(!j)return;fails=0;st.textContent='';
    (j.events||[]).forEach(apply);poll();
  }).catch(function(){
    clearTimeout(tm);if(pollCtl!==ctl)return;
    polling=false;fails++;st.textContent='Нет связи, пробую снова…';setTimeout(poll,Math.min(15000,1000*fails))});
}
// возврат из фона (iPhone): старый запрос могли потерять — начинаем опрос заново с последнего события
function kick(){
  if(initial)return;
  if(pollCtl){var old=pollCtl;pollCtl=null;polling=false;old.abort()}
  poll();
  if(stick)bottom();
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')kick()});
window.addEventListener('pageshow',function(e){if(e.persisted)kick()});  // только возврат из кэша Safari, не обычная загрузка
var cmds=document.getElementById('cmds'),cmdBtn=document.getElementById('cmd');
cmdBtn.onclick=function(){cmds.hidden=!cmds.hidden;cmdBtn.setAttribute('aria-expanded',String(!cmds.hidden))};
cmds.onclick=function(e){var b=e.target.closest('button[data-cmd]');if(!b)return;var c=b.getAttribute('data-cmd');cmds.hidden=true;cmdBtn.setAttribute('aria-expanded','false');send({text:c})};
document.getElementById('f').onsubmit=function(e){
  e.preventDefault();var v=inp.value.trim();if(!v)return;inp.value='';send({text:v});
};
try{var standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(/iPhone|iPad/.test(navigator.userAgent)&&!standalone&&!localStorage.getItem('zc_ios')){var ios=document.getElementById('ios');ios.style.display='block';ios.onclick=function(){ios.style.display='none';localStorage.setItem('zc_ios','1')}}}catch(e){}
// Уведомления (Web Push): приходят, даже когда сайт закрыт. На iPhone — если сайт добавлен на экран «Домой».
var nt=document.getElementById('nt');
var canPush='serviceWorker' in navigator&&'PushManager' in window&&!!window.Notification;
function keyBytes(k){k=k.replace(/-/g,'+').replace(/_/g,'/');while(k.length%4)k+='=';var b=atob(k),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function pushOn(){
  if(!canPush)return Promise.resolve(false);
  return navigator.serviceWorker.register('/sw.js').then(function(reg){
    return reg.pushManager.getSubscription().then(function(sub){
      if(sub)return sub;
      return fetch(API+'/api/push/key',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(j){
        return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(j.key)})});
    });
  }).then(function(sub){
    return fetch(API+'/api/push/subscribe',{method:'POST',headers:H(),body:JSON.stringify(sub.toJSON()),credentials:'same-origin'})
      .then(function(r){window.__pushOn=r.ok;return r.ok});
  }).catch(function(){return false});
}
function askPush(e){
  if(e)e.preventDefault();
  if(!canPush){st.textContent=/iPhone|iPad/.test(navigator.userAgent)?
    'На iPhone уведомления работают, когда сайт добавлен на экран «Домой»: «Поделиться» → «На экран „Домой“», затем откройте его оттуда и нажмите 🔔.':
    'Этот браузер не умеет уведомления для сайтов. Сообщения всё равно появятся здесь, в чате.';return}
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){st.textContent='Уведомления для этого сайта запрещены. Разрешите их: значок слева в адресной строке → «Уведомления» → «Разрешить», затем нажмите 🔔 ещё раз.';return}
    pushOn().then(function(ok){nt.hidden=ok;st.textContent=ok?'Уведомления включены ✅':'Не получилось включить уведомления в этом браузере.'});
  });
}
nt.onclick=askPush;
// уже разрешено — подписываемся молча; иначе кнопка видна всегда (в том числе если запрещено: подскажет, как разрешить)
if(canPush&&Notification.permission==='granted')pushOn().then(function(ok){nt.hidden=ok});
else nt.hidden=false;
fetch('__API__/api/history',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(j){
  (j.messages||[]).forEach(function(m){render(m)});bottom();last=j.last;initial=false;
  if(j.admin)document.getElementById('ad').hidden=false;
  if(!j.messages.length)send({text:'/start'});
  poll();
}).catch(function(){st.textContent='Не удалось загрузить чат';initial=false;poll()});
})();
</script>
</body>
</html>
